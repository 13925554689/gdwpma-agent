{% extends "base.html" %}
{% block body %}
<div style="max-width:360px;margin:60px auto">
<div class="panel">
<h2>登录</h2>
{% if error %}<p style="color:var(--warn)">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="next" value="{{ next }}">
  <p><input name="username" placeholder="用户名" required style="width:100%"></p>
  <p><input name="password" type="password" placeholder="密码" required style="width:100%"></p>
  <button class="btn" type="submit" style="width:100%">登录</button>
</form>
<p class="kw">初始账号 admin / gdwpma@2026（单机版，登录后可在数据库改密）</p>
</div>
</div>
{% endblock %}

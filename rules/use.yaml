# 用：资金使用过程审核规则（依据：国办发〔2024〕52号(十)(十一)、财预〔2021〕110号用途调整指引、财预〔2021〕175号处理处罚机制、财办预〔2022〕27号进度预警、审计署实证）
rules:
  - "no": US-001
    name: 挪用债券资金
    severity: P0
    clause: 国办发〔2024〕52号(十一)；财预〔2021〕175号
    check: 资金不得用于土地收储（合规土储债除外）、楼堂馆所、企业还贷、房地产商业开发等禁止用途。
    evidence: [专户流水, 支付凭证]
    audit_source: 审计署2023：93.17亿元违规用于土地收储、楼堂馆所、企业还贷
  - "no": US-002
    name: 挤占截留挪用
    severity: P0
    clause: 国办发〔2024〕52号(十一)
    check: 专户管理、专款专用，无挤占、截留、挪用情形。
    evidence: [专户流水]
  - "no": US-003
    name: 资金闲置超期
    severity: P1
    clause: 财办预〔2022〕27号支出进度通报预警机制
    check: 债券资金到账后按进度使用，闲置超过规定期限触发预警并说明原因。
    evidence: [专户流水, 实物工作量影像]
    auto: "idle_days > 180"
  - "no": US-004
    name: 超进度拨付沉淀施工方
    severity: P1
    clause: 审计实证；国办发〔2024〕52号(十)
    check: 支付进度与实物工作量匹配，不得超进度拨付形成资金在施工单位沉淀。
    evidence: [支付凭证, 监理计量报告]
    audit_source: 审计署：31个项目超进度拨付48亿元沉淀施工单位
  - "no": US-005
    name: 支付流程不合规
    severity: P1
    clause: 国库集中支付制度；项目资金管理办法
    check: 按工程进度、合同约定和支付审批流程支付，手续完备。
    evidence: [支付凭证, 合同]
  - "no": US-006
    name: 收支两条线未落实
    severity: P1
    clause: 政府性基金预算管理规定
    check: 项目收入全额缴入国库或专户归集，不得坐支、直接抵扣支出。
    evidence: [收入缴库凭证]
  - "no": US-007
    name: 用途调整程序不合规
    severity: P0
    clause: 财预〔2021〕110号用途调整操作指引
    check: 用途调整须履行省级批准程序并按规定披露，未批先用即为违规。
    evidence: [调整批准文件]
  - "no": US-008
    name: 未按负面清单动态核查用途
    severity: P1
    clause: 国办发〔2024〕52号附件
    check: 资金投向与批准用途一致，定期核查实际用途与申报用途偏差。
    evidence: [专户流水, 实施方案]
  - "no": US-009
    name: 进度滞后未调度
    severity: P2
    clause: 国办发〔2024〕52号(十)定期调度机制
    check: 项目开工建设进度纳入调度，滞后项目有督办记录。
    evidence: [调度记录]
  - "no": US-010
    name: 支付给关联方异常
    severity: P1
    clause: 财预〔2021〕175号
    check: 大额支付对象与项目单位、主管部门存在关联关系的须说明商业合理性。
    evidence: [支付凭证]
  - "no": US-011
    name: 账务处理不规范
    severity: P2
    clause: 《地方政府专项债券相关业务会计处理暂行规定》
    check: 按规定确认负债、报送专项债券项目投资表和资金还款情况表。
    evidence: [投资表, 还款情况表]
  - "no": US-012
    name: 资金拨付不及时
    severity: P1
    clause: 国办发〔2024〕52号(十)
    check: 已发行债券资金及时拨付项目单位，不得滞留财政专户。
    evidence: [拨付凭证]
    auto: "alloc_to_pay_days > 30"

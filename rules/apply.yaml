# 借：项目库建设与申报审核规则（依据：国发〔2014〕43号、国办发〔2024〕52号、财预61/110/175号、自然资发〔2025〕45号、律所审查清单、审计署2023-2025报告实证违规模式）
rules:
  - "no": AP-001
    name: 投向领域触碰负面清单
    severity: P0
    clause: 国办发〔2024〕52号附件《专项债券投向领域禁止类项目清单》
    check: 项目不得属于主题文旅公园、仿古商业街区、商业房地产开发、楼堂馆所、一般竞争性产业项目等禁止领域（保障性住房与合规土储除外）。
    evidence: [实施方案, 可研批复]
    audit_source: 审计署2024：广西违规使用专项债44.91亿元投向商业房地产开发
    auto: "category_bad"
  - "no": AP-002
    name: 项目三性缺失
    severity: P0
    clause: 国发〔2014〕43号二；国办发〔2024〕52号
    check: 项目必须同时具备公益性、收益性、资本性，融资规模与项目收益相平衡。
    evidence: [实施方案, 财务评估报告]
  - "no": AP-003
    name: 收益覆盖倍数不足
    severity: P0
    clause: 国办发〔2024〕52号(四)融资收益平衡；财预〔2021〕61号
    check: 项目运营期收入对债券本息覆盖倍数≥1.2，不足即为否决项。
    evidence: [融资平衡方案, 财务评估报告]
    audit_source: 审计署2025：17县虚报预期收益将69个不平衡项目包装获债121.74亿元
    auto: "coverage < 1.2"
  - "no": AP-004
    name: 覆盖倍数临界未附敏感性分析
    severity: P1
    clause: 国办发〔2024〕52号(四)
    check: 覆盖倍数1.2~1.5的，须附收入敏感性分析说明。
    evidence: [融资平衡方案]
    auto: "1.2 <= coverage < 1.5"
  - "no": AP-005
    name: 前期要件不齐备
    severity: P0
    clause: 国办发〔2024〕52号(八)
    check: 用地预审与选址意见书、可研批复、初设批复、环评等前期要件齐备；未落实用地手续的项目不得申报。
    evidence: [用地预审, 可研批复, 初设批复, 环评]
    audit_source: 审计署2024：吉林22个项目因手续不齐难以开工，资金闲置59.93亿元
  - "no": AP-006
    name: 一案两书缺失
    severity: P0
    clause: 国办发〔2024〕52号(五)；财库〔2020〕36号
    check: 项目收益与融资自求平衡方案、财务评估报告、法律意见书齐备且在有效期内。
    evidence: [融资平衡方案, 财务评估报告, 法律意见书]
  - "no": AP-007
    name: 中介机构及人员资质瑕疵
    severity: P1
    clause: 财库〔2020〕36号
    check: 会计师事务所、律师事务所、评级机构合法存续、具备资质，签字人员执业状态正常。
    evidence: [财务评估报告, 法律意见书, 信用评级报告]
  - "no": AP-008
    name: 申报材料数据不一致
    severity: P1
    clause: 专项债律师审查清单；财预〔2021〕61号
    check: 可研报告、平衡方案、财务评估报告之间的总投资、分年投资、预期收益数据一致。
    evidence: [可研批复, 融资平衡方案, 财务评估报告]
  - "no": AP-009
    name: 收入来源不合规
    severity: P0
    clause: 国办发〔2024〕52号(四)
    check: 收入仅限项目自身收入、关联土地出让收入、依法合规的政府补贴收入三类，且来源可验证。
    evidence: [融资平衡方案, 收入依据文件]
    audit_source: 审计署：部分项目收入来源不符合专项债发行要求
  - "no": AP-010
    name: 建设内容不明确
    severity: P1
    clause: 国办发〔2024〕52号(十)
    check: 实施方案须明确具体建设内容、规模与进度安排，不得笼统表述导致无法实施。
    evidence: [实施方案]
    audit_source: 审计署2024：吉林10个项目未确定具体建设内容致资金闲置16.81亿元
  - "no": AP-011
    name: 资本金比例超限
    severity: P1
    clause: 国办发〔2024〕52号(一)
    check: 专项债券用作项目资本金规模不超过该省用于项目建设专项债券规模的30%。
    evidence: [融资平衡方案]
    auto: "cap_ratio > 30"
  - "no": AP-012
    name: 债券期限与项目周期不匹配
    severity: P1
    clause: 财库〔2020〕36号第九条
    check: 专项债券期限应与项目建设和运营周期匹配，不匹配的须说明接续发行安排。
    evidence: [实施方案, 融资平衡方案]
  - "no": AP-013
    name: 申请规模超出可用额度
    severity: P2
    clause: 预算法第43条；财预〔2023〕51号
    check: 申报金额应在本地区剩余债务限额与年度额度空间内。
    evidence: [额度文件]
    auto: "bond_amount > limit_remaining"
  - "no": AP-014
    name: 棚改项目未纳入计划
    severity: P1
    clause: 财预〔2018〕28号
    check: 棚户区改造项目须已纳入省年度棚改规划并列入国家年度棚改计划。
    evidence: [省棚改计划文件]
  - "no": AP-015
    name: 土储项目实施机构不在名录
    severity: P1
    clause: 自然资发〔2025〕45号
    check: 土地储备项目须由列入自然资源部及省土储机构名录的机构实施。
    evidence: [土储名录查询记录]
  - "no": AP-016
    name: 偿债主体及会计处理约定不明
    severity: P1
    clause: 《地方政府专项债券相关业务会计处理暂行规定》
    check: 实施方案/平衡方案须明确项目单位是否承担本息偿还义务，作为会计确认负债依据。
    evidence: [融资平衡方案]
  - "no": AP-017
    name: 实施方案要素不全
    severity: P2
    clause: 国办发〔2024〕52号(五)标准化模板
    check: 按标准化模板核对项目概况、建设内容、进度、资金筹措、使用计划、风险等要素。
    evidence: [实施方案]
  - "no": AP-018
    name: 在建项目续发条件不符
    severity: P1
    clause: 国办发〔2024〕52号(七)
    check: 在建项目续发须已通过国家发改委、财政部审核，经省级政府批准，同步备案。
    evidence: [此前审核结果文件]
  - "no": AP-019
    name: 信息披露材料不齐
    severity: P2
    clause: 《地方政府债务信息公开办法（试行）》
    check: 发行前须准备经济社会发展指标、基金预算、债务限额余额、项目信息、第三方评估信息等披露材料。
    evidence: [信息披露文件]
  - "no": AP-020
    name: 立项审批链条断裂
    severity: P0
    clause: 国办发〔2024〕52号(八)
    check: 项目建议书批复→可研批复→初设批复→立项/备案/核准链条完整，批复文号可查证。
    evidence: [可研批复, 初设批复]
